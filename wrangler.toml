name = "edge-exchange-api"   # 建议与 Pages 项目名一致，避免警告
main = "src/index.ts"
compatibility_date = "2024-12-18"

[[kv_namespaces]]
binding = "FX_CACHE"
# 不写 id，部署后通过 Dashboard 绑定

[[d1_databases]]
binding = "FX_DB"
database_name = "fx-db"
# 不写 id，部署后通过 Dashboard 绑定

[triggers]
crons = ["*/1 * * * *"]

[vars]
RATE_LIMIT = "100"
API_KEY = "sdfgjksdfgjklsdfgkl"

[env.production]
vars = { RATE_LIMIT = "200" }

# ---------- 本地开发环境（可选） ----------
# 如需在本地使用代理，可取消注释并在 .dev.vars 中配置
# [env.dev]
# vars = { HTTP_PROXY = "http://127.0.0.1:7897" }